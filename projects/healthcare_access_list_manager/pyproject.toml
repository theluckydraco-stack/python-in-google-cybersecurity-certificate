[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hacl-healthcare-access-list-manager"
version = "1.0.0"
description = "Recoverable IPv4 allow-list governance with structured audit records"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Oluwasegunfunmi Kazeem" }
]
keywords = [
  "access-control",
  "allow-list",
  "audit-logging",
  "cybersecurity",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
hacl = "hACL:main"

[tool.setuptools]
py-modules = ["hACL"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=hACL",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hACL"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
files = ["hACL.py"]
